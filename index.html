<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>FVX Tournament</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}header{padding:17px;background:#111116;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:20px;font-weight:900;color:#ffc107}.logo span{color:#e53935}main{padding:16px;padding-bottom:90px;max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#e53935,#8b1111);padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0 0 9px;font-size:27px}h2{font-size:20px;margin-top:20px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#ffc107;color:#111}button.red{background:#e53935;color:white}button.gray{background:#292930;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.quick,.card{background:#17171d;border:1px solid #292930;border-radius:15px}.quick{padding:16px;text-align:center}.card{padding:16px;margin:10px 0}.card h3{margin:0 0 8px;color:#ffc107}.muted{color:#aaa;font-size:14px}.row{display:flex;justify-content:space-between;gap:8px;margin:7px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#111116;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-top:1px solid #292930;z-index:5}nav button{background:transparent;color:#aaa;padding:8px 3px;font-size:12px}nav button.active{color:#ffc107}input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#0f0f13;color:#fff}.success{color:#63e36f}.danger{color:#ff6464}</style></head><body><header><div class="logo">🔥 <span>FLAME</span> VORTEX</div><div>🔔</div></header><main id="app"></main><nav><button onclick="show('home')" id="n-home">🏠<br>Home</button><button onclick="show('tournaments')" id="n-tournaments">🏆<br>Tournaments</button><button onclick="show('leaderboard')" id="n-leaderboard">📊<br>Leaderboard</button><button onclick="show('profile')" id="n-profile">👤<br>Profile</button></nav><script>
const tournaments=[{name:'FVX SOLO BATTLE',mode:'Solo',entry:'৳10',prize:'৳500',slots:'48/50',date:'15 Aug',time:'9:00 PM'},{name:'FVX NIGHT CUP',mode:'Squad',entry:'৳20',prize:'৳1,000',slots:'40/48',date:'16 Aug',time:'10:00 PM'},{name:'FVX WEEKLY WAR',mode:'Squad',entry:'৳10',prize:'৳750',slots:'32/48',date:'17 Aug',time:'9:30 PM'}];let regs=JSON.parse(localStorage.getItem('fvxRegs')||'[]'),results=JSON.parse(localStorage.getItem('fvxResults')||'[]');
function card(t){return `<div class="card"><h3>🔥 ${t.name}</h3><div class="row"><span>Mode: ${t.mode}</span><b>${t.prize}</b></div><div class="row muted"><span>Entry ${t.entry}</span><span>${t.slots} slots</span></div><div class="row muted"><span>${t.date}</span><span>${t.time}</span></div><button onclick="register('${t.name}')">REGISTER</button></div>`}function show(page){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');let a=document.getElementById('app');if(page==='home')a.innerHTML=`<section class="hero"><h1>🏆 FVX NIGHT CUP</h1><p>Entry ৳20 • Prize Pool ৳1,000 • Squad</p><button onclick="register('FVX NIGHT CUP')">JOIN NOW</button></section><h2>Quick Actions</h2><div class="grid"><div class="quick">🎮<br>Solo</div><div class="quick">👥<br>Squad</div><div class="quick" onclick="show('profile')">🏆<br>My Tournaments</div><div class="quick">📢<br>Notice</div></div><h2>Upcoming</h2>${tournaments.map(card).join('')}`;if(page==='tournaments')a.innerHTML=`<h1>🏆 Tournaments</h1>${tournaments.map(card).join('')}`;if(page==='leaderboard')leaderboard();if(page==='profile')profile()}
function register(name){document.getElementById('app').innerHTML=`<h1>📝 Registration</h1><p class="muted">${name}</p><div class="card"><input id="nm" placeholder="Player / Team Name"><input id="uid" placeholder="Free Fire UID"><input id="phone" placeholder="Contact Number"><button onclick="submitReg('${name}')">CONFIRM REGISTRATION</button><p id="msg"></p></div>`}function submitReg(name){let nm=document.getElementById('nm').value.trim(),uid=document.getElementById('uid').value.trim(),phone=document.getElementById('phone').value.trim();if(!nm||!uid){msg.innerHTML='<span class="danger">Name এবং UID দাও।</span>';return}regs.push({name:nm,uid,phone,tournament:name,status:'Pending'});localStorage.setItem('fvxRegs',JSON.stringify(regs));msg.innerHTML='<span class="success">✅ Registration Submitted! Admin approval pending.</span>'}
function profile(){document.getElementById('app').innerHTML=`<h1>👤 Profile</h1><div class="card"><h2>NAYEM</h2><p class="muted">Free Fire UID: —</p><p>🏆 Registrations: ${regs.length}</p><p>🥇 Wins: 0</p><p>🎯 Total Kills: 0</p></div><div class="card"><h3>👨‍💼 Admin</h3><p class="muted">Prototype admin controls are stored on this device.</p><button onclick="adminLogin()">OPEN ADMIN PANEL</button></div>`}function adminLogin(){document.getElementById('app').innerHTML=`<h1>🔐 Admin Login</h1><div class="card"><input id="adminPass" type="password" placeholder="Admin password"><button onclick="checkAdmin()">LOGIN</button><p id="adminMsg" class="danger"></p><p class="muted">Demo password: FVX123</p></div>`}function checkAdmin(){if(adminPass.value==='FVX123')admin();else adminMsg.textContent='Wrong password'}function admin(){document.getElementById('app').innerHTML=`<h1>👨‍💼 Admin Panel</h1><div class="card"><h3>Create Tournament</h3><input id="tn" placeholder="Tournament Name"><select id="tm"><option>Solo</option><option>Duo</option><option>Squad</option></select><input id="te" placeholder="Entry Fee"><input id="tp" placeholder="Prize Pool"><input id="ts" placeholder="Maximum Slots"><input type="date" id="td"><input type="time" id="tt"><button onclick="createTournament()">CREATE TOURNAMENT</button><p id="createMsg"></p></div><div class="card"><h3>📋 Registrations (${regs.length})</h3>${regs.length?regs.map((r,i)=>`<div class="row"><span>${r.name}<br><small>${r.uid} • ${r.tournament}</small></span><button onclick="approve(${i})">${r.status}</button></div>`).join(''):'<p class="muted">No registrations yet.</p>'}</div><div class="card"><h3>🎮 Match Room</h3><input id="rid" placeholder="Room ID"><input id="rp" placeholder="Room Password"><input id="rt" placeholder="Match Time"><button onclick="publishRoom()">PUBLISH ROOM</button><p id="roomMsg"></p></div><div class="card"><h3>🏁 Add Result</h3><input id="rn" placeholder="Team / Player"><input id="rk" type="number" placeholder="Kills"><input id="rpl" type="number" placeholder="Placement"><button onclick="addResult()">SUBMIT RESULT</button><p id="resultMsg"></p></div>`}function approve(i){regs[i].status=regs[i].status==='Approved'?'Pending':'Approved';localStorage.setItem('fvxRegs',JSON.stringify(regs));admin()}function createTournament(){let n=tn.value;if(!n){createMsg.textContent='Tournament name দাও';return}tournaments.push({name:n,mode:tm.value,entry:te.value||'Free',prize:tp.value||'—',slots:'0/'+(ts.value||'48'),date:td.value||'TBA',time:tt.value||'TBA'});createMsg.innerHTML='<span class="success">✅ Tournament created on this device.</span>'}function publishRoom(){localStorage.setItem('fvxRoom',JSON.stringify({id:rid.value,password:rp.value,time:rt.value}));roomMsg.innerHTML='<span class="success">✅ Room details saved.</span>'}function addResult(){let name=rn.value,k=Number(rk.value)||0,p=Number(rpl.value)||0;if(!name){resultMsg.textContent='Player/Team name দাও';return}let points=k+Math.max(0,11-p);results.push({name,kills:k,placement:p,points});localStorage.setItem('fvxResults',JSON.stringify(results));resultMsg.innerHTML='<span class="success">✅ Result saved. Points: '+points+'</span>'}function leaderboard(){let data=[...results].sort((a,b)=>b.points-a.points);app.innerHTML=`<h1>📊 Leaderboard</h1><div class="card"><h3>FVX NIGHT CUP</h3>${data.length?data.map((x,i)=>`<div class="row"><span>#${i+1} ${x.name}<br><small>${x.kills} kills • Placement ${x.placement}</small></span><b>${x.points} pts</b></div>`).join(''):'<p class="muted">No results published yet.</p>'}</div>`}show('home');</script></body></html>
