<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>FVX Tournament</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#111116;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:20px;font-weight:900;color:#ffc107}.logo span{color:#e53935}
main{padding:16px;padding-bottom:90px}.hero{background:linear-gradient(135deg,#e53935,#8b1111);padding:22px;border-radius:18px;margin-bottom:18px}
h1{margin:0 0 7px;font-size:27px}.hero p{margin:5px 0 16px;color:#ffeaea}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#ffc107;color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.quick{background:#17171d;border:1px solid #292930;padding:16px;border-radius:14px;text-align:center}
h2{font-size:20px}.card{background:#17171d;border-radius:15px;padding:16px;margin:10px 0;border:1px solid #292930}
.card h3{margin:0 0 8px;color:#ffc107}.muted{color:#aaa;font-size:14px}.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#111116;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-top:1px solid #292930}
nav button{background:transparent;color:#aaa;padding:8px 3px;font-size:12px}nav button.active{color:#ffc107}
input,select{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#0f0f13;color:#fff}
.hide{display:none}.success{color:#63e36f}.danger{color:#ff6464}
</style>
</head>
<body>
<header><div class="logo">🔥 <span>FLAME</span> VORTEX</div><div>🔔</div></header>
<main id="app"></main>
<nav>
<button onclick="show('home')" id="n-home">🏠<br>Home</button>
<button onclick="show('tournaments')" id="n-tournaments">🏆<br>Tournaments</button>
<button onclick="show('leaderboard')" id="n-leaderboard">📊<br>Leaderboard</button>
<button onclick="show('profile')" id="n-profile">👤<br>Profile</button>
</nav>
<script>
const tournaments=[
{name:'FVX SOLO BATTLE',mode:'Solo',entry:'৳10',prize:'৳500',slots:'48/50',date:'15 Aug',time:'9:00 PM'},
{name:'FVX NIGHT CUP',mode:'Squad',entry:'৳20',prize:'৳1,000',slots:'40/48',date:'16 Aug',time:'10:00 PM'},
{name:'FVX WEEKLY WAR',mode:'Squad',entry:'৳10',prize:'৳750',slots:'32/48',date:'17 Aug',time:'9:30 PM'}
];
function card(t){return `<div class="card"><h3>🔥 ${t.name}</h3><div class="row"><span>Mode: ${t.mode}</span><b>${t.prize}</b></div><div class="row muted"><span>Entry ${t.entry}</span><span>${t.slots} slots</span></div><div class="row muted"><span>${t.date}</span><span>${t.time}</span></div><button onclick="register('${t.name}')">REGISTER</button></div>`}
function show(page){
document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+page)?.classList.add('active');
let a=document.getElementById('app');
if(page==='home')a.innerHTML=`<section class="hero"><h1>🏆 FVX NIGHT CUP</h1><p>Entry ৳20 • Prize Pool ৳1,000 • Squad</p><button onclick="register('FVX NIGHT CUP')">JOIN NOW</button></section><h2>Quick Actions</h2><div class="grid"><div class="quick">🎮<br>Solo</div><div class="quick">👥<br>Squad</div><div class="quick">🏆<br>My Tournaments</div><div class="quick">📢<br>Notice</div></div><h2>Upcoming</h2>${tournaments.map(card).join('')}`;
if(page==='tournaments')a.innerHTML=`<h1>🏆 Tournaments</h1>${tournaments.map(card).join('')}`;
if(page==='leaderboard')a.innerHTML=`<h1>📊 Leaderboard</h1><div class="card"><h3>FVX NIGHT CUP</h3><div class="row"><b>#1 FVX RAPID</b><b>28 pts</b></div><div class="row"><span>#2 TEAM X</span><b>23 pts</b></div><div class="row"><span>#3 TEAM Y</span><b>20 pts</b></div><div class="row"><span>#4 TEAM Z</span><b>17 pts</b></div></div>`;
if(page==='profile')a.innerHTML=`<h1>👤 Profile</h1><div class="card"><h2>NAYEM</h2><p class="muted">Free Fire UID: —</p><p>🏆 Tournaments: 0</p><p>🥇 Wins: 0</p><p>🎯 Total Kills: 0</p></div><div class="card"><h3>👨‍💼 Admin</h3><button onclick="admin()">Open Admin Panel</button></div>`;
}
function register(name){document.getElementById('app').innerHTML=`<h1>📝 Registration</h1><p class="muted">${name}</p><div class="card"><input id="nm" placeholder="Player / Team Name"><input id="uid" placeholder="Free Fire UID"><input id="phone" placeholder="Contact Number"><button onclick="submitReg('${name}')">CONFIRM REGISTRATION</button><p id="msg"></p></div>`}
function submitReg(name){let nm=document.getElementById('nm').value,uid=document.getElementById('uid').value;if(!nm||!uid){document.getElementById('msg').innerHTML='<span class="danger">Name এবং UID দাও।</span>';return}localStorage.setItem('fvxReg',JSON.stringify({name:nm,uid,tournament:name}));document.getElementById('msg').innerHTML='<span class="success">✅ Registration Successful!</span>'}
function admin(){document.getElementById('app').innerHTML=`<h1>👨‍💼 Admin Panel</h1><div class="card"><h3>Create Tournament</h3><input placeholder="Tournament Name"><select><option>Solo</option><option>Duo</option><option>Squad</option></select><input placeholder="Entry Fee"><input placeholder="Prize Pool"><input type="date"><input type="time"><button>CREATE TOURNAMENT</button></div><div class="card"><h3>Match Management</h3><input placeholder="Room ID"><input placeholder="Room Password"><button>PUBLISH ROOM</button></div><div class="card"><h3>Result</h3><input placeholder="Team / Player"><input placeholder="Kills"><input placeholder="Placement"><button>SUBMIT RESULT</button></div>`}
show('home');
</script>
</body></html>
