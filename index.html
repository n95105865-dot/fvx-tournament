<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>FVX Tournament</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}header{padding:17px;background:#111116;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:20px;font-weight:900;color:#ffc107}.logo span{color:#e53935}main{padding:16px 16px 90px;max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#e53935,#8b1111);padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0 0 9px;font-size:27px}h2{font-size:20px;margin-top:20px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;background:#ffc107;color:#111;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.quick,.card{background:#17171d;border:1px solid #292930;border-radius:15px}.quick{padding:16px;text-align:center}.card{padding:16px;margin:10px 0}.card h3{margin:0 0 8px;color:#ffc107}.muted{color:#aaa;font-size:14px}.row{display:flex;justify-content:space-between;gap:8px;margin:7px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#111116;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-top:1px solid #292930;z-index:5}nav button{background:transparent;color:#aaa;padding:8px 3px;font-size:12px}nav button.active{color:#ffc107}input,select{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#0f0f13;color:#fff}.success{color:#63e36f}.danger{color:#ff6464}</style></head><body><header><div class="logo">🔥 <span>FLAME</span> VORTEX</div><div>🔔</div></header><main id="app"></main><nav><button onclick="show('home')" id="n-home">🏠<br>Home</button><button onclick="show('tournaments')" id="n-tournaments">🏆<br>Tournaments</button><button onclick="show('leaderboard')" id="n-leaderboard">📊<br>Leaderboard</button><button onclick="show('profile')" id="n-profile">👤<br>Profile</button></nav><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyA0hGSo2rjgn2CZkSDR4LYYSfksd0j9b_s",authDomain:"fvx-tournament.firebaseapp.com",projectId:"fvx-tournament",storageBucket:"fvx-tournament.firebasestorage.app",messagingSenderId:"1075686507431",appId:"1:1075686507431:web:855fd10ae33355d5aa2c82"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const defaultTournaments=[{name:"FVX SOLO BATTLE",mode:"Solo",entry:"৳10",prize:"৳500",slots:"48/50",date:"15 Aug",time:"9:00 PM"},{name:"FVX NIGHT CUP",mode:"Squad",entry:"৳20",prize:"৳1,000",slots:"40/48",date:"16 Aug",time:"10:00 PM"},{name:"FVX WEEKLY WAR",mode:"Squad",entry:"৳10",prize:"৳750",slots:"32/48",date:"17 Aug",time:"9:30 PM"}];let tournaments=[],regs=[],results=[],currentTournament="";
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function loadData(){try{const[t,r,res]=await Promise.all([db.collection("tournaments").orderBy("createdAt","desc").get(),db.collection("registrations").orderBy("createdAt","desc").get(),db.collection("results").orderBy("points","desc").get()]);tournaments=t.docs.map(d=>({id:d.id,...d.data()}));regs=r.docs.map(d=>({id:d.id,...d.data()}));results=res.docs.map(d=>({id:d.id,...d.data()}));if(!tournaments.length)tournaments=[...defaultTournaments];}catch(e){console.error(e);tournaments=[...defaultTournaments];regs=[];results=[];}}
function card(t){const name=String(t.name||"Tournament");return '<div class="card"><h3>🔥 '+esc(name)+'</h3><div class="row"><span>Mode: '+esc(t.mode)+'</span><b>'+esc(t.prize||"—")+'</b></div><div class="row muted"><span>Entry '+esc(t.entry||"Free")+'</span><span>'+esc(t.slots||"—")+' slots</span></div><div class="row muted"><span>'+esc(t.date||"TBA")+'</span><span>'+esc(t.time||"TBA")+'</span></div><button type="button" onclick="register('+JSON.stringify(name)+')">REGISTER</button></div>';}
function show(page){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));const active=document.getElementById("n-"+page);if(active)active.classList.add("active");const app=document.getElementById("app");if(page==="home"){app.innerHTML='<section class="hero"><h1>🏆 FVX NIGHT CUP</h1><p>Entry ৳20 • Prize Pool ৳1,000 • Squad</p><button type="button" onclick="register(\'FVX NIGHT CUP\')">JOIN NOW</button></section><h2>Quick Actions</h2><div class="grid"><div class="quick">🎮<br>Solo</div><div class="quick">👥<br>Squad</div><div class="quick" onclick="show(\'profile\')">🏆<br>My Tournaments</div><div class="quick">📢<br>Notice</div></div><h2>Upcoming</h2>'+tournaments.map(card).join("");return;}if(page==="tournaments"){app.innerHTML="<h1>🏆 Tournaments</h1>"+tournaments.map(card).join("");return;}if(page==="leaderboard"){leaderboard();return;}if(page==="profile"){profile();return;}}
function register(name){currentTournament=String(name||"");document.getElementById("app").innerHTML='<h1>📝 Registration</h1><p class="muted">'+esc(currentTournament)+'</p><div class="card"><input id="nm" placeholder="Player / Team Name"><input id="uid" placeholder="Free Fire UID"><input id="phone" placeholder="Contact Number"><button type="button" onclick="submitReg()">CONFIRM REGISTRATION</button><p id="msg"></p></div>';}
async function submitReg(){const name=document.getElementById("nm").value.trim(),uid=document.getElementById("uid").value.trim(),phone=document.getElementById("phone").value.trim(),msg=document.getElementById("msg");if(!name||!uid){msg.innerHTML='<span class="danger">Name এবং UID দাও।</span>';return;}msg.innerHTML='<span class="muted">Submitting...</span>';try{await db.collection("registrations").add({name,uid,phone,tournament:currentTournament||"Unknown",status:"Pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<span class="success">✅ Registration Submitted! Admin approval pending.</span>';loadData();}catch(e){console.error(e);msg.innerHTML='<span class="danger">Firestore setup/permission check করো।</span>';}}
function profile(){const kills=results.reduce((s,x)=>s+(Number(x.kills)||0),0);document.getElementById("app").innerHTML='<h1>👤 Profile</h1><div class="card"><h2>NAYEM</h2><p class="muted">Free Fire UID: —</p><p>🏆 Registrations: '+regs.length+'</p><p>🥇 Wins: 0</p><p>🎯 Total Kills: '+kills+'</p></div><div class="card"><h3>👨‍💼 Admin</h3><p class="muted">Demo admin panel. Firebase Authentication and Security Rules should be added before public launch.</p><button type="button" onclick="adminLogin()">OPEN ADMIN PANEL</button></div>';}
function adminLogin(){document.getElementById("app").innerHTML='<h1>🔐 Admin Login</h1><div class="card"><input id="adminPass" type="password" placeholder="Admin password"><button type="button" onclick="checkAdmin()">LOGIN</button><p id="adminMsg" class="danger"></p><p class="muted">Demo password: FVX123</p></div>';}
function checkAdmin(){if(document.getElementById("adminPass").value==="FVX123")admin();else document.getElementById("adminMsg").textContent="Wrong password";}
async function admin(){await loadData();document.getElementById("app").innerHTML='<h1>👨‍💼 Admin Panel</h1><div class="card"><h3>Create Tournament</h3><input id="tn" placeholder="Tournament Name"><select id="tm"><option>Solo</option><option>Duo</option><option>Squad</option></select><input id="te" placeholder="Entry Fee"><input id="tp" placeholder="Prize Pool"><input id="ts" placeholder="Maximum Slots"><input type="date" id="td"><input type="time" id="tt"><button type="button" onclick="createTournament()">CREATE TOURNAMENT</button><p id="createMsg"></p></div><div class="card"><h3>📋 Registrations ('+regs.length+')</h3>'+(regs.length?regs.map(r=>'<div class="card"><div><b>'+esc(r.name)+'</b><br><small>'+esc(r.uid)+' • '+esc(r.tournament)+'</small>'+(r.phone?'<br><small>📞 '+esc(r.phone)+'</small>':'')+'<br><small>Status: '+esc(r.status||"Pending")+'</small></div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" onclick="setRegStatus('+JSON.stringify(r.id)+',\'Approved\')">APPROVE</button><button type="button" onclick="setRegStatus('+JSON.stringify(r.id)+',\'Rejected\')">REJECT</button></div></div>').join(""):'<p class="muted">No registrations yet.</p>')+'</div><div class="card"><h3>🎮 Match Room</h3><input id="rid" placeholder="Room ID"><input id="rp" placeholder="Room Password"><input id="rt" placeholder="Match Time"><input id="rtn" placeholder="Tournament Name"><button type="button" onclick="publishRoom()">PUBLISH ROOM</button><p id="roomMsg"></p></div><div class="card"><h3>🏁 Add Result</h3><input id="rn" placeholder="Team / Player"><input id="rk" type="number" placeholder="Kills"><input id="rpl" type="number" placeholder="Placement"><input id="rtn2" placeholder="Tournament Name"><button type="button" onclick="addResult()">SUBMIT RESULT</button><p id="resultMsg"></p></div>';}
async function setRegStatus(id,status){try{await db.collection("registrations").doc(id).update({status});await admin();}catch(e){console.error(e);alert("Firestore permission/error. Check Firestore Rules.");}}
async function createTournament(){const name=document.getElementById("tn").value.trim(),msg=document.getElementById("createMsg");if(!name){msg.textContent="Tournament name দাও";return;}msg.innerHTML='<span class="muted">Creating...</span>';try{await db.collection("tournaments").add({name,mode:document.getElementById("tm").value,entry:document.getElementById("te").value||"Free",prize:document.getElementById("tp").value||"—",slots:"0/"+(document.getElementById("ts").value||"48"),date:document.getElementById("td").value||"TBA",time:document.getElementById("tt").value||"TBA",createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<span class="success">✅ Tournament created online.</span>';await loadData();}catch(e){console.error(e);msg.innerHTML='<span class="danger">Firestore setup/permissions check করো।</span>';}}
async function publishRoom(){const msg=document.getElementById("roomMsg");msg.innerHTML='<span class="muted">Saving...</span>';try{await db.collection("rooms").add({tournament:document.getElementById("rtn").value,roomId:document.getElementById("rid").value,password:document.getElementById("rp").value,time:document.getElementById("rt").value,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<span class="success">✅ Room saved online.</span>';}catch(e){console.error(e);msg.innerHTML='<span class="danger">Room save হয়নি।</span>';}}
async function addResult(){const name=document.getElementById("rn").value.trim(),kills=Number(document.getElementById("rk").value)||0,placement=Number(document.getElementById("rpl").value)||0,msg=document.getElementById("resultMsg");if(!name){msg.textContent="Player/Team name দাও";return;}const points=kills+Math.max(0,11-placement);msg.innerHTML='<span class="muted">Saving...</span>';try{await db.collection("results").add({name,kills,placement,points,tournament:document.getElementById("rtn2").value,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg.innerHTML='<span class="success">✅ Result saved online. Points: '+points+'</span>';await loadData();}catch(e){console.error(e);msg.innerHTML='<span class="danger">Result save হয়নি।</span>';}}
function leaderboard(){const data=[...results].sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0));document.getElementById("app").innerHTML='<h1>📊 Leaderboard</h1><div class="card"><h3>FVX LEADERBOARD</h3>'+(data.length?data.map((x,i)=>'<div class="row"><span>#'+(i+1)+' '+esc(x.name)+'<br><small>'+esc(x.kills)+' kills • Placement '+esc(x.placement)+'</small></span><b>'+esc(x.points)+' pts</b></div>').join(""):'<p class="muted">No results published yet.</p>')+'</div>';}
(async function(){show("home");await loadData();show("home");})();
</script></body></html>
