<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FVX Esports Hub</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#697386;--brand:#e53935;--brand2:#ffb300;--line:#e7ebf2;--green:#16a34a;--blue:#2563eb;--shadow:0 8px 25px rgba(20,30,50,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:20px}.logo b{color:var(--brand)}.logo span{color:#111}
.icon{background:#f3f5f9;border:0;border-radius:12px;padding:10px 12px}
main{max-width:900px;margin:auto;padding:18px 16px 100px}
.hero{background:linear-gradient(120deg,#e53935,#ff7a18);color:#fff;border-radius:22px;padding:25px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0 0 18px;opacity:.92}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--brand2);color:#171717}
.btn.white{background:#fff;color:#b71c1c}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.gray{background:#eef1f6;color:#293246}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:11px 0;box-shadow:var(--shadow)}
.stat{display:flex;align-items:center;gap:12px}.stat .ico{font-size:25px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0}
h2{font-size:21px;margin:20px 0 10px}h3{margin:3px 0 8px}.badge{padding:5px 9px;border-radius:20px;background:#fff4d6;color:#8a5a00;font-size:12px;font-weight:800}.approved{background:#dcfce7;color:#166534}.pending{background:#fff7ed;color:#9a3412}
input,select,textarea{width:100%;border:1px solid #d9deea;background:#fff;color:#172033;padding:12px;border-radius:10px;margin:5px 0;font:inherit}textarea{min-height:180px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.nav button{background:#fff;border:0;padding:9px 3px;color:#697386;font-size:11px}.nav button.active{color:var(--brand);font-weight:800}
.room{background:#eef7ff;border:1px solid #cfe6ff;border-radius:13px;padding:12px;margin-top:10px}.room b{color:#1459a6}.rules{white-space:pre-wrap;line-height:1.6;font-size:14px}.ad{border-left:5px solid var(--brand2);background:#fff9e8}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}
.toast{padding:10px;border-radius:10px;margin-top:8px;background:#ecfdf3;color:#166534}.err{background:#fff1f2;color:#be123c}
.ai{position:fixed;right:18px;bottom:75px;width:54px;height:54px;border:0;border-radius:50%;background:#172033;color:#fff;font-size:22px;box-shadow:var(--shadow);z-index:35}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}

.wallet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wallet-box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}
.feature-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feature-btn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:800;cursor:pointer}
@media(max-width:650px){.wallet-grid,.feature-list{grid-template-columns:1fr}}

.profile-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin:18px 0}
.profile-top{display:flex;gap:16px;align-items:center}
.profile-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#eef1f6;border:0;flex:none}
.vip-badge{display:inline-block;background:#fff0b8;color:#8a5a00;padding:7px 12px;border-radius:18px;font-weight:900;font-size:13px;margin-bottom:7px}
.profile-name{font-size:28px;font-weight:900;margin:0 0 6px}
.profile-line{color:var(--muted);font-weight:700;margin:4px 0}
.edit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{font-size:22px;font-weight:900;margin:22px 0 10px}
.feature-list.one-col{grid-template-columns:1fr}
.feature-btn{min-height:56px;font-size:16px}
.wallet-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin:18px 0}
.wallet-balance{font-size:42px;font-weight:900;margin:4px 0 8px}
.wallet-note{color:var(--muted);font-size:14px;margin-bottom:14px}
.wallet-actions{display:grid;grid-template-columns:1fr;gap:10px}
@media(max-width:650px){.profile-top{align-items:flex-start}.profile-name{font-size:25px}.edit-row{grid-template-columns:1fr}}


/* Compact Profile options */
.wallet-actions .feature-btn,
.profile-card ~ .wallet-card .feature-btn,
#app .feature-list.one-col .feature-btn {
  min-height: 44px;
  height: 44px;
  padding: 8px 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  line-height: 1.1;
}
.wallet-actions { gap: 8px; }
#app .feature-list.one-col { gap: 8px; }

</style>
</head>
<body>
<header><div class="logo">🔥 <b>FLAME</b> <span>VORTEX</span></div><button class="icon" onclick="profile()">👤</button></header>
<main id="app"></main>
<button class="ai" onclick="aiHelp()">🤖</button>
<div class="nav">
<button id="n-home" onclick="show('home')">🏠<br>Home</button>
<button id="n-t" onclick="show('tournaments')">🏆<br>Tournaments</button>
<button id="n-reg" onclick="show('registrations')">📝<br>My Reg</button>
<button id="n-lb" onclick="show('leaderboard')">📊<br>Leaderboard</button>
<button id="n-p" onclick="profile()">👤<br>Profile</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyA0hGSo2rjgn2CZkSDR4LYYSfksd0j9b_s",
 authDomain:"fvx-tournament.firebaseapp.com",
 projectId:"fvx-tournament",
 storageBucket:"fvx-tournament.firebasestorage.app",
 messagingSenderId:"1075686507431",
 appId:"1:1075686507431:web:855fd10ae33355d5aa2c82"
};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let tournaments=[],regs=[],results=[],rooms=[],rulesText=`📜 FULL TOURNAMENT RULES

1. সঠিক Player Name ও UID দিতে হবে।
2. ভুল তথ্য দিলে Registration বাতিল হতে পারে।
3. Approved Player ছাড়া Match-এ অংশ নেওয়া যাবে না।
4. Hack, Script, Cheat বা unfair advantage নিষিদ্ধ।
5. Room ID ও Password নির্ধারিত সময়ে প্রকাশ করা হবে।
6. Match শুরু হওয়ার আগে Room-এ Join করতে হবে।
7. Admin-এর সিদ্ধান্ত Rules অনুযায়ী চূড়ান্ত হবে।
8. Result যাচাই শেষে Leaderboard প্রকাশ করা হবে।`;
let currentTournament="";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
 try{
  const q=await Promise.all([
   db.collection("tournaments").orderBy("createdAt","desc").get(),
   db.collection("registrations").orderBy("createdAt","desc").get(),
   db.collection("results").orderBy("points","desc").get(),
   db.collection("rooms").orderBy("createdAt","desc").get(),
   db.collection("settings").doc("rules").get()
  ]);
  tournaments=q[0].docs.map(d=>({id:d.id,...d.data()}));
  regs=q[1].docs.map(d=>({id:d.id,...d.data()}));
  results=q[2].docs.map(d=>({id:d.id,...d.data()}));
  rooms=q[3].docs.map(d=>({id:d.id,...d.data()}));
  if(q[4].exists&&q[4].data().text)rulesText=q[4].data().text;
 }catch(e){console.log(e)}
}
function roomFor(n){return rooms.find(r=>String(r.tournament)===String(n))}
function slotsFor(t){let total=String(t.slots||"0/48").split("/")[1]||"48";let used=regs.filter(r=>r.tournament===t.name).length;return used+"/"+total}
function tournamentCard(t){
 let room=roomFor(t.name);
 return `<div class="card">
 <div class="row"><h3>🏆 ${esc(t.name)}</h3><span class="badge">${esc(t.mode||"Squad")}</span></div>
 <div class="grid"><div class="stat"><span class="ico">🎟️</span><div><b>${esc(t.entry||"Free")}</b><div class="muted">Entry Fee</div></div></div>
 <div class="stat"><span class="ico">💰</span><div><b>${esc(t.prize||"—")}</b><div class="muted">Prize Pool</div></div></div></div>
 <div class="row muted"><span>📅 ${esc(t.date||"TBA")} • ⏰ ${esc(t.time||"TBA")}</span><b>${esc(slotsFor(t))} Slots</b></div>
 ${room?`<div class="room">🎮 <b>Room Published</b><br>Room ID: <b>${esc(room.roomId)}</b><br>Password: <b>${esc(room.password)}</b><br>Time: ${esc(room.time)}</div>`:""}
 <button class="btn blue" onclick='details(${JSON.stringify(t.name)})'>VIEW</button>
 <button class="btn" onclick='register(${JSON.stringify(t.name)})'>REGISTER</button>
 </div>`;
}
function nav(active){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));let el=document.getElementById("n-"+active);if(el)el.classList.add("active")}
function show(p){
 if(p==="home"){nav("home");home()}
 if(p==="tournaments"){nav("t");document.getElementById("app").innerHTML="<h2>🏆 All Tournaments</h2>"+(tournaments.map(tournamentCard).join("")||'<div class="card">কোনো Tournament নেই।</div>')}
 if(p==="registrations"){nav("reg");myRegs()}
 if(p==="leaderboard"){nav("lb");leaderboard()}
}
function home(){
 nav("home");
 document.getElementById("app").innerHTML=`<section class="hero"><h1>🔥 FVX Esports Tournament Hub</h1><p>Register • Play • Compete • Win</p><button class="btn white" onclick="show('tournaments')">VIEW TOURNAMENTS</button></section>
 <div class="grid"><div class="card"><div class="stat"><span class="ico">🏆</span><div><b>${tournaments.length}</b><div class="muted">Active Tournaments</div></div></div></div>
 <div class="card"><div class="stat"><span class="ico">👥</span><div><b>${regs.length}</b><div class="muted">Registrations</div></div></div></div></div>
 <div class="card ad"><h3>📢 Advertisement</h3><p class="muted">এখানে তোমার Tournament Promotion, Sponsor অথবা Announcement দেখাতে পারবে।</p><button class="btn" onclick="promo()">PROMOTE TOURNAMENT</button></div>
 <h2>🔥 Upcoming Tournaments</h2>${tournaments.slice(0,6).map(tournamentCard).join("")||'<div class="card">এখনো Tournament তৈরি করা হয়নি। Admin Panel থেকে Create Tournament করো।</div>'}`;
}
function details(name){
 const t=tournaments.find(x=>x.name===name)||{name};const room=roomFor(name);
 document.getElementById("app").innerHTML=`<button class="btn gray" onclick="show('tournaments')">← Back</button><h2>🏆 ${esc(name)}</h2>${tournamentCard(t)}
 <div class="card"><h3>📜 Full Tournament Rules</h3><div class="rules">${esc(rulesText)}</div></div>
 ${room?`<div class="card"><h3>🎮 Match Room</h3><div class="room">🆔 ${esc(room.roomId)}<br>🔐 ${esc(room.password)}<br>⏰ ${esc(room.time)}</div></div>`:""}`;
}
function register(name){
 currentTournament=name;
 document.getElementById("app").innerHTML=`<button class="btn gray" onclick='details(${JSON.stringify(name)})'>← Back</button><h2>📝 Registration</h2>
 <div class="card"><h3>${esc(name)}</h3><input id="rname" placeholder="Player / Team Name"><input id="uid" placeholder="Free Fire UID"><input id="contact" placeholder="Contact Number">
 <label><input type="checkbox" id="agree" style="width:auto"> I agree to Tournament Rules</label><br><button class="btn green" onclick="submitReg()">CONFIRM REGISTRATION</button><div id="regmsg"></div></div>`;
}
async function submitReg(){
 if(!rname.value.trim()||!uid.value.trim()){regmsg.innerHTML='<div class="toast err">Name এবং UID দাও।</div>';return}
 if(!agree.checked){regmsg.innerHTML='<div class="toast err">Rules accept করো।</div>';return}
 try{await db.collection("registrations").add({name:rname.value.trim(),uid:uid.value.trim(),phone:contact.value.trim(),tournament:currentTournament,status:"Pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});regmsg.innerHTML='<div class="toast">✅ Registration submitted — Pending Approval.</div>';await load()}catch(e){regmsg.innerHTML='<div class="toast err">Registration save হয়নি।</div>'}
}
async function myRegs(){
 nav("reg");
 try{await load();}catch(e){}
 let u=getProfileUid();
 const render=(uid)=>{
   let mine=uid ? regs.filter(r=>String(r.uid||"").trim()===String(uid).trim()) : [];
   document.getElementById("app").innerHTML=`<h2>📝 My Registrations</h2>
   <div class="card">
     <div class="muted">নিজের Registration দেখতে Free Fire UID দিয়ে Search করো।</div>
     <input id="myRegUid" value="${esc(uid)}" placeholder="Free Fire UID">
     <button class="btn blue" onclick="localStorage.setItem('fvx_uid',myRegUid.value.trim());myRegs()">🔎 SEARCH MY REGISTRATIONS</button>
   </div>
   ${uid && mine.length ? mine.map(r=>`<div class="card">
     <div class="row"><b>${esc(r.name||"Player")}</b>
       <span class="badge ${r.status==="Approved"?"approved":"pending"}">${esc(r.status||"Pending")}</span>
     </div>
     <div class="muted">🏆 ${esc(r.tournament||"Tournament")} • UID ${esc(r.uid||uid)}</div>
   </div>`).join("") :
   (uid ? '<div class="card">এই UID-এর কোনো Registration পাওয়া যায়নি।</div>' : '<div class="card">UID লিখে Search করো।</div>')}`;
 };
 render(u);
}
function leaderboard(){
 nav("lb");let d=[...results].sort((a,b)=>(b.points||0)-(a.points||0));
 document.getElementById("app").innerHTML=`<h2>📊 Leaderboard</h2><div class="card"><table><tr><th>#</th><th>Player/Team</th><th>Kills</th><th>Points</th></tr>${d.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.kills)}</td><td><b>${esc(x.points)}</b></td></tr>`).join("")||'<tr><td colspan="4">No results yet.</td></tr>'}</table></div>`;
}
function getProfile(){
  let saved={};
  try{saved=JSON.parse(localStorage.getItem("fvx_profile")||"{}")}catch(e){}
  return {
    name:saved.name||"FVX–RAPID.i!",
    uid:saved.uid||localStorage.getItem("fvx_uid")||"8075895670",
    contact:saved.contact||"01840039126",
    photo:saved.photo||""
  };
}
function saveProfileData(data){
  localStorage.setItem("fvx_profile",JSON.stringify(data));
  localStorage.setItem("fvx_uid",data.uid||"");
}
function profile(){
  nav("p");
  const p=getProfile();
  const photo=p.photo || "";
  document.getElementById("app").innerHTML=`<div class="profile-card">
    <div class="profile-top">
      ${photo?`<img class="profile-photo" src="${esc(photo)}" alt="Profile">`:`<div class="profile-photo" style="display:flex;align-items:center;justify-content:center;font-size:48px">👤</div>`}
      <div style="min-width:0">
        <div class="vip-badge">⭐ VIP PLAYER</div>
        <div class="profile-name">${esc(p.name)}</div>
        <div class="profile-line">UID: ${esc(p.uid)}</div>
        <div class="profile-line">Contact: ${esc(p.contact)}</div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn" onclick="editProfile()">✏️ EDIT PROFILE</button>
    </div>
  </div>

  <div class="wallet-card">
    <div class="muted">💰 SANDBOX WALLET — TEST MONEY ONLY</div>
    <div class="wallet-balance">৳<span id="walletBalance">${localStorage.getItem("fvx_test_balance")||100}.00</span></div>
    <div class="wallet-note">bKash / Nagad / Rocket এখন real-money payment নয়।</div>
    <div class="wallet-actions">
      <button class="feature-btn" onclick="addTestMoney()">➕ Add Test Money</button>
      <button class="feature-btn" onclick="walletPayment()">💳 Wallet Payment</button>
      <button class="feature-btn" onclick="walletHistory()">🧾 Transaction History</button>
      <button class="feature-btn" onclick="pendingPayments()">⏳ Pending Payments</button>
    </div>
  </div>

  <div class="section-title">🎮 Player Features</div>
  <div class="card">
    <div class="feature-list one-col">
      <button class="feature-btn" onclick="myDashboard()">🏆 My Tournament Dashboard</button>
      <button class="feature-btn" onclick="myRegs()">📝 My Registrations</button>
      <button class="feature-btn" onclick="tournamentHistory()">📜 Tournament History</button>
      <button class="feature-btn" onclick="playerStats()">📊 Player Stats</button>
      <button class="feature-btn" onclick="shareProgram()">📤 Share Program</button>
      <button class="feature-btn" onclick="integrationInfo()">🔗 Integration</button>
    </div>
  </div>

  <div class="card">
    <h3>👨‍💼 Admin Panel</h3>
    <p class="muted">Tournament create, approval, room, rules, result entry, UID player search ও leaderboard manage করা যাবে।</p>
    <button class="btn blue" onclick="adminLogin()">OPEN ADMIN PANEL</button>
  </div>`;
}
function editProfile(){
  const p=getProfile();
  document.getElementById("app").innerHTML=`<button class="btn gray" onclick="profile()">← Back</button>
  <h2>✏️ Edit Profile</h2>
  <div class="card">
    <label><b>Player Photo</b></label>
    <input id="photoInput" type="file" accept="image/*">
    <div style="margin:12px 0;text-align:center">
      ${p.photo?`<img id="photoPreview" class="profile-photo" src="${esc(p.photo)}" alt="Preview">`:`<div id="photoPreview" class="profile-photo" style="display:inline-flex;align-items:center;justify-content:center;font-size:44px">👤</div>`}
    </div>
    <label><b>Player Name</b></label>
    <input id="editName" value="${esc(p.name)}" placeholder="Player Name">
    <label><b>Free Fire UID</b></label>
    <input id="editUid" value="${esc(p.uid)}" placeholder="UID">
    <label><b>Contact Number</b></label>
    <input id="editContact" value="${esc(p.contact)}" placeholder="Contact Number">
    <button class="btn blue" onclick="saveEditedProfile()">SAVE PROFILE</button>
    <div id="profileMsg"></div>
  </div>`;
  document.getElementById("photoInput").addEventListener("change",function(){
    const f=this.files&&this.files[0];
    if(!f)return;
    const reader=new FileReader();
    reader.onload=e=>{
      const el=document.getElementById("photoPreview");
      if(el.tagName==="IMG") el.src=e.target.result;
      else {el.outerHTML=`<img id="photoPreview" class="profile-photo" src="${e.target.result}" alt="Preview">`;}
      window._fvxPendingPhoto=e.target.result;
    };
    reader.readAsDataURL(f);
  });
}
function saveEditedProfile(){
  const old=getProfile();
  const data={
    name:(document.getElementById("editName").value||"").trim()||old.name,
    uid:(document.getElementById("editUid").value||"").trim()||old.uid,
    contact:(document.getElementById("editContact").value||"").trim()||old.contact,
    photo:window._fvxPendingPhoto||old.photo||""
  };
  saveProfileData(data);
  window._fvxPendingPhoto="";
  document.getElementById("profileMsg").innerHTML='<div class="toast">✅ Profile saved.</div>';
  setTimeout(profile,350);
}
function pendingPayments(){
  alert("⏳ Pending Payments\nএই সংস্করণে payment system sandbox/test mode-এ আছে।");
}
function adminLogin(){document.getElementById("app").innerHTML=`<h2>🔐 Admin Login</h2><div class="card"><input id="apass" type="password" placeholder="Admin Password"><button class="btn blue" onclick="if(apass.value==='FVX123')admin();else amsg.textContent='Wrong password'"><div id="amsg" class="muted"></div></div>`}
async function admin(){
 await load();
 document.getElementById("app").innerHTML=`<h2>👨‍💼 Admin Panel</h2>
 <div class="card"><h3>🏆 Create Tournament</h3>
 <input id="ctn" placeholder="Tournament Name"><select id="cm"><option>Solo</option><option>Duo</option><option>Squad</option></select>
 <input id="ce" placeholder="Entry Fee"><input id="cp" placeholder="Prize Pool"><input id="cs" type="number" value="48" placeholder="Total Slots">
 <input id="cd" type="date"><input id="ct" type="time"><button class="btn blue" onclick="createTournament()">CREATE TOURNAMENT</button><div id="cmsg"></div></div>

 <div class="card"><h3>🕐 Tournament Time Edit</h3><select id="etid">${tournaments.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><input id="ed" type="date"><input id="et" type="time"><button class="btn" onclick="editTournamentTime()">SAVE TIME</button><div id="emsg"></div></div>

 <div class="card"><h3>📋 Registration Approval</h3>${regs.map(r=>`<div class="row"><span><b>${esc(r.name)}</b><br><small>${esc(r.uid)} • ${esc(r.tournament)}</small></span><button class="btn ${r.status==="Approved"?"green":"gray"}" onclick='toggleApprove("${r.id}","${esc(r.status)}")'>${esc(r.status||"Pending")}</button></div>`).join("")||"No registrations."}</div>

 <div class="card"><h3>🎮 Match Room + Publish</h3><input id="rtour" placeholder="Tournament Name"><input id="rid" placeholder="Room ID"><input id="rpass" placeholder="Room Password"><input id="rtime" placeholder="Room Time"><button class="btn green" onclick="publishRoom()">PUBLISH ROOM</button><div id="rmsg"></div></div>

 <div class="card"><h3>📜 Full Rules</h3><textarea id="rules">${esc(rulesText)}</textarea><button class="btn" onclick="saveRules()">SAVE RULES</button><div id="rulesmsg"></div></div>

 <div class="card"><h3>📢 Advertisement / Promotion</h3><input id="adtitle" placeholder="Ad / Announcement Title"><input id="adtext" placeholder="Promotion Text"><button class="btn" onclick="saveAd()">SAVE AD</button><div id="admsg"></div></div>

 <div class="card"><h3>🏁 Result & Leaderboard</h3><input id="resuid" placeholder="Player UID"><input id="resname" placeholder="Player / Team"><input id="reskills" type="number" placeholder="Kills"><input id="resplace" type="number" placeholder="Placement"><input id="restour" placeholder="Tournament Name"><button class="btn" onclick="findResultPlayer()">🔎 FIND PLAYER BY UID</button> <button class="btn blue" onclick="addResult()">PUBLISH RESULT</button><div id="resmsg"></div></div>`;
}
async function createTournament(){
 if(!ctn.value.trim()){cmsg.innerHTML='<div class="toast err">Tournament Name দাও।</div>';return}
 try{await db.collection("tournaments").add({name:ctn.value.trim(),mode:cm.value,entry:ce.value||"Free",prize:cp.value||"—",slots:"0/"+(cs.value||48),date:cd.value||"TBA",time:ct.value||"TBA",createdAt:firebase.firestore.FieldValue.serverTimestamp()});cmsg.innerHTML='<div class="toast">✅ Tournament Created!</div>';await load()}catch(e){cmsg.innerHTML='<div class="toast err">Create failed.</div>'}
}
async function editTournamentTime(){try{await db.collection("tournaments").doc(etid.value).update({date:ed.value||"TBA",time:et.value||"TBA"});emsg.innerHTML='<div class="toast">✅ Time updated.</div>';await load()}catch(e){emsg.innerHTML='<div class="toast err">Update failed.</div>'}}
async function toggleApprove(id,status){try{await db.collection("registrations").doc(id).update({status:status==="Approved"?"Pending":"Approved"});admin()}catch(e){alert("Firestore error")}}
async function publishRoom(){try{await db.collection("rooms").add({tournament:rtour.value.trim(),roomId:rid.value.trim(),password:rpass.value.trim(),time:rtime.value.trim(),published:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});rmsg.innerHTML='<div class="toast">✅ Room Published.</div>';await load()}catch(e){rmsg.innerHTML='<div class="toast err">Room save failed.</div>'}}
async function saveRules(){try{rulesText=rules.value.trim();await db.collection("settings").doc("rules").set({text:rulesText,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});rulesmsg.innerHTML='<div class="toast">✅ Rules saved.</div>'}catch(e){rulesmsg.innerHTML='<div class="toast err">Save failed.</div>'}}
async function saveAd(){try{await db.collection("ads").add({title:adtitle.value,text:adtext.value,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});admsg.innerHTML='<div class="toast">✅ Advertisement saved.</div>'}catch(e){admsg.innerHTML='<div class="toast err">Ad save failed.</div>'}}
async function findResultPlayer(){
 let u=(resuid.value||"").trim();
 if(!u){resmsg.innerHTML='<div class="toast err">UID দাও।</div>';return}
 let r=regs.find(x=>String(x.uid||"").trim()===u);
 if(r){resname.value=r.name||"";resmsg.innerHTML='<div class="toast">✅ Player found: '+esc(r.name||"")+'</div>'}
 else resmsg.innerHTML='<div class="toast err">এই UID-এর registration পাওয়া যায়নি।</div>';
}
async function addResult(){
 let uidv=(resuid.value||"").trim(),k=Number(reskills.value)||0,p=Number(resplace.value)||0,n=(resname.value||"").trim();
 if(!uidv){resmsg.innerHTML='<div class="toast err">Player UID দাও।</div>';return}
 let reg=regs.find(x=>String(x.uid||"").trim()===uidv);
 if(!reg){resmsg.innerHTML='<div class="toast err">এই UID-এর registration পাওয়া যায়নি।</div>';return}
 n=n||reg.name||"Player";
 try{
   await db.collection("results").add({uid:uidv,name:n,kills:k,placement:p,points:k+Math.max(0,11-p),tournament:restour.value,tournamentName:restour.value,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   resmsg.innerHTML='<div class="toast">✅ Result published for UID '+esc(uidv)+'.</div>'; await load();
 }catch(e){resmsg.innerHTML='<div class="toast err">Result failed: '+esc(e.message||"Firestore error")+'</div>'}
}
function getProfileUid(){
 let el=document.getElementById("profileUid"), u=(el?el.value:"").trim();
 if(u)localStorage.setItem("fvx_uid",u);
 return u||localStorage.getItem("fvx_uid")||"";
}
function myDashboard(){
 let u=getProfileUid();
 if(!u){document.getElementById("app").innerHTML='<h2>🏆 My Tournament Dashboard</h2><div class="card"><input id="dashUid" placeholder="Free Fire UID"><button class="btn blue" onclick="localStorage.setItem("fvx_uid",dashUid.value.trim());myDashboard()">SEARCH</button></div>';return}
 let mine=regs.filter(r=>String(r.uid||"").trim()===u), mr=results.filter(r=>String(r.uid||"").trim()===u);
 document.getElementById("app").innerHTML=`<button class="btn gray" onclick="profile()">← Profile</button><h2>🏆 My Tournament Dashboard</h2>
 <div class="card"><input id="dashUid" value="${esc(u)}" placeholder="Free Fire UID"><button class="btn blue" onclick="localStorage.setItem('fvx_uid',dashUid.value.trim());myDashboard()">SEARCH</button></div>
 <div class="wallet-grid"><div class="wallet-box"><b>${mine.length}</b><div class="muted">Total Registrations</div></div><div class="wallet-box"><b>${mine.filter(r=>r.status==="Approved").length}</b><div class="muted">Approved</div></div><div class="wallet-box"><b>${mine.filter(r=>r.status!=="Approved").length}</b><div class="muted">Pending</div></div><div class="wallet-box"><b>${mr.reduce((s,r)=>s+Number(r.points||0),0)}</b><div class="muted">Total Points</div></div></div>
 <div class="card"><h3>📝 Registrations</h3>${mine.map(r=>`<div class="row"><span>${esc(r.tournament)}</span><span class="badge ${r.status==="Approved"?"approved":"pending"}">${esc(r.status||"Pending")}</span></div>`).join("")||'<div class="muted">No registration found.</div>'}</div>
 <div class="card"><h3>📊 Results</h3>${mr.map(r=>`<div class="row"><span>${esc(r.tournament||r.tournamentName||"Tournament")}<br><small>Kills ${esc(r.kills||0)} • Placement ${esc(r.placement||0)}</small></span><b>${esc(r.points||0)} pts</b></div>`).join("")||'<div class="muted">No results found.</div>'}</div>`;
}
async function tournamentHistory(){
  nav("p");
  try{await load();}catch(e){}
  const u=String(getProfileUid()||"").trim();
  const mineRegs=regs.filter(r=>String(r.uid||"").trim()===u);
  const mineResults=results.filter(r=>String(r.uid||"").trim()===u);

  const cards=[];
  const resultByTournament={};
  mineResults.forEach(r=>{
    const key=String(r.tournament||r.tournamentName||"").trim();
    if(key) resultByTournament[key]=r;
  });

  mineRegs.forEach(r=>{
    const key=String(r.tournament||"").trim();
    const rr=resultByTournament[key];
    cards.push(`<div class="card">
      <div class="row">
        <b>🏆 ${esc(key||"Tournament")}</b>
        <span class="badge ${r.status==="Approved"?"approved":"pending"}">${esc(r.status||"Pending")}</span>
      </div>
      <div class="muted">UID ${esc(r.uid||u)} • ${esc(r.name||"Player")}</div>
      ${rr?`<div style="margin-top:10px">
        <b>📊 Result</b>
        <div class="muted">Kills: ${esc(rr.kills||0)} • Placement: ${esc(rr.placement||0)} • Points: ${esc(rr.points||0)}</div>
      </div>`:`<div class="muted" style="margin-top:8px">⏳ Result not available yet.</div>`}
    </div>`);
  });

  // Also show results that exist even if a registration record is missing.
  mineResults.forEach(rr=>{
    const key=String(rr.tournament||rr.tournamentName||"").trim();
    const already=mineRegs.some(r=>String(r.tournament||"").trim()===key);
    if(!already) cards.push(`<div class="card">
      <div class="row"><b>🏆 ${esc(key||"Tournament")}</b><span class="badge approved">Result</span></div>
      <div class="muted">UID ${esc(rr.uid||u)}</div>
      <div style="margin-top:10px"><b>📊 Result</b><div class="muted">Kills: ${esc(rr.kills||0)} • Placement: ${esc(rr.placement||0)} • Points: ${esc(rr.points||0)}</div></div>
    </div>`);
  });

  document.getElementById("app").innerHTML=`
    <button class="btn gray" onclick="profile()">← Profile</button>
    <h2>📜 Tournament History</h2>
    <div class="card">
      <div class="muted">Your registration and result history for UID: <b>${esc(u||"Not set")}</b></div>
    </div>
    ${cards.join("")||'<div class="card">No tournament history found for this UID.</div>'}`;
}
async function playerStats(){
  try{await load();}catch(e){}
  const u=getProfileUid();
  const mine=results.filter(r=>String(r.uid||"").trim()===u);
  const kills=mine.reduce((s,r)=>s+Number(r.kills||0),0);
  const points=mine.reduce((s,r)=>s+Number(r.points||0),0);
  const placementPoints=mine.reduce((s,r)=>s+Number(r.placement||0),0);
  document.getElementById("app").innerHTML=`<button class="btn gray" onclick="profile()">← Profile</button>
  <h2>📊 Player Stats</h2>
  <div class="wallet-grid">
    <div class="wallet-box"><b>${mine.length}</b><div class="muted">Results</div></div>
    <div class="wallet-box"><b>${kills}</b><div class="muted">Kills</div></div>
    <div class="wallet-box"><b>${points}</b><div class="muted">Points</div></div>
    <div class="wallet-box"><b>${placementPoints}</b><div class="muted">Placement Total</div></div>
  </div>
  ${mine.map(r=>`<div class="card"><div class="row"><b>${esc(r.tournament||r.tournamentName||"Tournament")}</b><span class="badge approved">Result</span></div>
  <div class="muted">UID ${esc(r.uid||u)} • Kills ${esc(r.kills||0)} • Placement ${esc(r.placement||0)} • Points ${esc(r.points||0)}</div></div>`).join("")||'<div class="card">No results found for this UID yet.</div>'}`;
}
